<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Email Template</title>
</head>
<body style="margin:0;">

	<div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans','Liberation Sans',Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji';font-size:16px;line-height:1.5;padding:0 15px 70px 15px;position:relative;color:#fff;background:rgb(40,20,131);background:linear-gradient(150deg, rgba(40,20,131,1) 15%, rgba(143,110,213,1) 70%, rgba(215,130,217,1) 94%);">
		<span style="border-radius:50%;background-color:rgba(255,255,255,.1);position:absolute;height:150px;width:150px;left:-4%;bottom:auto;"></span>
		<span style="border-radius:50%;background-color:rgba(255,255,255,.1);position:absolute;height:50px;width:50px;right:4%;top:10%;"></span>
		<span style="border-radius:50%;position:absolute;height:50px;width:50px;bottom:150px;right:17%;background-color:rgba(255,255,255,.2);"></span>
		<span style="border-radius:50%;position:absolute;height:75px;width:75px;top:320px;right:7%;background-color:rgba(255,255,255,.15);"></span>
		<span style="border-radius:50%;position:absolute;height:100px;width:100px;top:38%;left:3%;right:auto;background-color:rgba(255,255,255,.05);"></span>
		<span style="border-radius:50%;position:absolute;height:200px;width:200px;top:23%;left:23%;right:auto;background-color:rgba(255,255,255,.08);"></span>
		<span style="border-radius:50%;position:absolute;height:50px;width:50px;bottom:50%;right:36%;background-color:rgba(255,255,255,.04);"></span>
		<span style="border-radius:50%;position:absolute;height:100px;width:100px;bottom:70px;right:2%;background-color:rgba(255,255,255,.2);"></span>
		<span style="border-radius:50%;background-color:rgba(255,255,255,.1);position:absolute;height:50px;width:50px;bottom:1%;right:2%;"></span>
		<span style="border-radius:50%;position:absolute;height:100px;width:100px;bottom:1%;left:1%;right:auto;background-color:rgba(255,255,255,.05);"></span>
		<div style="position:absolute;bottom:0;left:0;right:0;">
			<svg x="0" y="0" viewBox="0 0 2560 120" preserveAspectRatio="none" version="1.1" xmlns="http://www.w3.org/2000/svg" style="vertical-align:bottom;margin-bottom:-1px;">
				<polygon points="2560 0 2560 120 0 120" fill="#ffffff"></polygon>
			</svg>
		</div>

		<div style="width:100%;max-width:640px;padding:35px 0 30px 0;margin:auto;">

			<div style="text-align:center;margin-bottom:12px;">
				<img src="http://ui.ndfriends.org/Content/assets/images/logo-w.png" height="74" alt="ND Friends">
			</div>

			<div style="background-color:#ffffff;padding:30px 25px;color:#252525;border-radius:4px;">

				<div style="font-weight:700;">Dear Support Team,</div>
				<p>New Ticket has been generated from ND Friends support form.</p>

				<div style="margin-top:16px;">
					<div style="margin-bottom:16px;">
						<div>Name: <span style="font-weight:600;">[Name]</span></div>
					</div>
					<div style="margin-bottom:16px;">
						<div>From Email: <span style="font-weight:600;">[Email]</span></div>
					</div>
					<div style="margin-bottom:16px;">
						<div>Device Used: <span style="font-weight:600;">[Device]</span></div>
					</div>
					<div style="margin-bottom:16px;">
						<div>Browser: <span style="font-weight:600;">[Browser]</span></div>
					</div>
					<div style="margin-bottom:16px;">
						<div>Issue Facing: <span style="font-weight:600;">[Issue]</span></div>
					</div>
					<div>
						<div>Message:<br><span style="font-weight:600;">[Message]</span></div>
					</div>
				</div>

				<div style="margin-top:40px;">
					Stay Well,<br>
					The ND Friends Team
				</div>

			</div>
			<div style="text-align:right;margin-top:5px;font-size:14px;color:#d5d5d5;">&copy; ND Friends</div>

		</div>
	</div>

</body>
</html>
